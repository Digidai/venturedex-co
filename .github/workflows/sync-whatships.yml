name: Sync VentureDex launches

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: venturedex-whatships-sync
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    if: github.repository == 'Digidai/venturedex-co'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify thumbnail tooling
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi

      - name: Restore successful launch checkpoint
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/launch-sync-state
          key: launch-sync-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: launch-sync-v2-

      - name: Fetch and validate published launch metadata
        id: source
        run: npm run whatships:sync -- --batch
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Generate missing original-video covers
        run: npm run launches:covers

      - name: Plan pending notifications including interrupted prior runs
        run: npx tsx scripts/launch-sync-state.ts plan "$RUNNER_TEMP/launch-sync-state/completed.json" "$RUNNER_TEMP/launch-indexnow-urls.json"

      - name: Verify the channel contract
        run: |
          npx tsx --test tests/whatships.test.ts tests/launch-covers.test.ts
          npm run launches:covers:check

      - name: Check generated diff
        run: |
          set -euo pipefail
          git diff --check
          unexpected="$( { git diff --name-only; git ls-files --others --exclude-standard; } | grep -Ev '^(content/(whatships|launch-covers)\.json|public/launch-covers/[a-f0-9]{24}\.webp)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Sync changed a path outside the launch snapshot/derived cover allowlist." >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Commit a changed snapshot
        id: commit
        run: |
          set -euo pipefail
          if git diff --quiet -- content/whatships.json content/launch-covers.json && [ -z "$(git ls-files --others --exclude-standard public/launch-covers)" ]; then
            echo "Launch snapshot is already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "pushed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin main
          local_parent="$(git rev-parse HEAD)"
          remote_parent="$(git rev-parse refs/remotes/origin/main)"
          if [ "$local_parent" != "$remote_parent" ]; then
            echo "Remote main advanced from $local_parent to $remote_parent; refusing to rebase or overwrite it." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/whatships.json content/launch-covers.json public/launch-covers
          commit_body="$(printf '%s\n%s\n%s\n%s\n%s\n%s' \
            "Upstream commit: $UPSTREAM_COMMIT" \
            "Raw SHA-256: $UPSTREAM_HASH" \
            "Canonical output SHA-256: $OUTPUT_HASH" \
            "Published items: $ITEM_COUNT" \
            "Changes: +$ADDITIONS, ~$UPDATES, -$REMOVALS" \
            "Original X video/post URLs, factual metadata, and derived stills only; no videos or catalog descriptions/posters mirrored.")"
          git commit \
            -m "content(launches): sync launch channel" \
            -m "$commit_body"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "pushed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        env:
          UPSTREAM_COMMIT: ${{ steps.source.outputs.source_commit }}
          UPSTREAM_HASH: ${{ steps.source.outputs.source_hash }}
          OUTPUT_HASH: ${{ steps.source.outputs.output_hash }}
          ITEM_COUNT: ${{ steps.source.outputs.item_count }}
          ADDITIONS: ${{ steps.source.outputs.additions }}
          UPDATES: ${{ steps.source.outputs.updates }}
          REMOVALS: ${{ steps.source.outputs.removals }}

      # A push authenticated with GITHUB_TOKEN intentionally does not recurse
      # into on:push workflows. workflow_dispatch is GitHub's documented
      # exception, so explicitly enter the existing exact-main release path.
      - name: Dispatch the audited release workflow
        id: deploy
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ -z "$remote_sha" ] || [ "$remote_sha" != "${{ steps.commit.outputs.pushed_sha }}" ]; then
            echo "main_pushed_dispatch_failed: current main ${remote_sha:-unknown} no longer matches the pushed launch SHA." >&2
            exit 1
          fi
          # Recover a previous pushed-but-unreleased snapshot even on no-op.
          # Reuse only a successful exact-SHA release; never infer live from Git.
          completed_run="$(gh run list --workflow deploy.yml --commit "${{ steps.commit.outputs.pushed_sha }}" --limit 30 --json databaseId,conclusion --jq '[.[] | select(.conclusion == "success")][0].databaseId // empty')"
          if [ -n "$completed_run" ]; then
            echo "run_id=$completed_run" >> "$GITHUB_OUTPUT"
            echo "Exact-SHA Deploy already succeeded: $completed_run" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          run_json="$(gh run list --workflow deploy.yml --commit "${{ steps.commit.outputs.pushed_sha }}" --limit 30 --json databaseId,headSha,status,url --jq '[.[] | select(.status != "completed")][0] // empty')"
          if [ -z "$run_json" ]; then
            dispatch_started="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            gh workflow run deploy.yml --ref main
            for attempt in $(seq 1 10); do
              run_json="$(gh run list \
                --workflow deploy.yml \
                --event workflow_dispatch \
                --commit "${{ steps.commit.outputs.pushed_sha }}" \
                --limit 20 \
                --json databaseId,headSha,status,url,createdAt \
                --jq "[.[] | select(.createdAt >= \"$dispatch_started\")][0] // empty")"
              if [ -n "$run_json" ]; then break; fi
              sleep 3
            done
          fi
          if [ -z "$run_json" ]; then
            echo "main_pushed_dispatch_failed: dispatch was accepted but no exact-SHA Deploy run was observed within 30 seconds." >&2
            exit 1
          fi
          run_id="$(jq -r '.databaseId' <<< "$run_json")"
          run_url="$(jq -r '.url' <<< "$run_json")"
          run_status="$(jq -r '.status' <<< "$run_json")"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          {
            echo "## Deploy dispatch"
            echo
            echo "- Pushed SHA: \`${{ steps.commit.outputs.pushed_sha }}\`"
            echo "- Deploy run: [$run_id]($run_url)"
            echo "- Observed state: \`$run_status\` (dispatch evidence, not publication evidence)"
          } >> "$GITHUB_STEP_SUMMARY"

          watch_status=0
          gh run watch "$run_id" --exit-status || watch_status=$?
          completed_json="$(gh run view "$run_id" --json conclusion,headSha,status,url)"
          completed_sha="$(jq -r '.headSha' <<< "$completed_json")"
          completed_status="$(jq -r '.status' <<< "$completed_json")"
          conclusion="$(jq -r '.conclusion' <<< "$completed_json")"
          {
            echo "- Completed state: \`$completed_status\`"
            echo "- Conclusion: \`$conclusion\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$completed_sha" != "${{ steps.commit.outputs.pushed_sha }}" ] || \
             [ "$completed_status" != "completed" ] || [ "$conclusion" != "success" ] || \
             [ "$watch_status" -ne 0 ]; then
            echo "deploy_not_published: exact launch SHA did not complete successfully." >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify live inventory and cover fingerprint
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "${{ steps.commit.outputs.pushed_sha }}"
          npx tsx scripts/launch-sync-state.ts verify-live

      - name: Notify IndexNow after exact deployment succeeds
        id: indexnow
        run: |
          set -euo pipefail
          url_count="$(jq 'length' "$RUNNER_TEMP/launch-indexnow-urls.json")"
          if [ "$url_count" -eq 0 ]; then
            echo "No pending notification; live inventory verified." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx tsx scripts/promotion/indexnow.ts \
            --urls-file "$RUNNER_TEMP/launch-indexnow-urls.json" \
            --history-file "$RUNNER_TEMP/launch-indexnow-history.jsonl" \
            --max-urls 10000
          {
            echo "## IndexNow notification"
            echo
            echo "- Boundary: exact Deploy run ${{ steps.deploy.outputs.run_id }} completed successfully before submission"
            echo "- Submitted canonical URLs: $url_count"
            echo "- Receipt: accepted by IndexNow; this is discovery evidence, not indexing proof"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record completed publication and notification
        run: npx tsx scripts/launch-sync-state.ts checkpoint "$RUNNER_TEMP/launch-sync-state/completed.json"

      - name: Save successful launch checkpoint
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/launch-sync-state
          key: launch-sync-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Preserve the IndexNow receipt
        if: always() && steps.indexnow.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: launch-indexnow-${{ steps.commit.outputs.pushed_sha }}
          path: |
            ${{ runner.temp }}/launch-indexnow-urls.json
            ${{ runner.temp }}/launch-indexnow-history.jsonl
          if-no-files-found: error
          retention-days: 30
