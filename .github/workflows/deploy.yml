name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]

concurrency:
  group: venturedex-production-deploy
  # A running release may already have published a Worker or mutated D1, so it
  # must finish. GitHub retains only the newest pending run in this group.
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main'
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success'
      )
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Every release is pinned to the checked-out SHA and must still equal
      # origin/main. A feature branch or tag can never be a production source.
      VENTUREDEX_RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      # A workflow_run release may trust only the exact commit that passed Validate.
      # Manual dispatch leaves this empty and runs the complete local gate.
      VENTUREDEX_VALIDATED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
      # Cloudflare Web Analytics beacon token (public id, not a secret). Inlined at
      # build time so the beacon ships on the deployed pages. See docs/observability.md.
      PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.VENTUREDEX_RELEASE_SHA }}
          # Discovery can compare with the last successful notification even
          # when intervening deploy runs were superseded or skipped.
          fetch-depth: 0

      - name: Refuse a non-main or superseded release commit
        run: |
          set -euo pipefail
          current_sha="$(git rev-parse HEAD)"
          remote_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "${current_sha}" != "${VENTUREDEX_RELEASE_SHA}" ]; then
            echo "Release SHA ${VENTUREDEX_RELEASE_SHA} does not match checkout ${current_sha}." >&2
            exit 1
          fi
          if [ -z "${remote_main_sha}" ] || [ "${remote_main_sha}" != "${VENTUREDEX_RELEASE_SHA}" ]; then
            echo "Release SHA ${VENTUREDEX_RELEASE_SHA} is not current origin/main (${remote_main_sha})." >&2
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit runtime and build dependencies
        run: npm audit --audit-level=high

      - name: Verify Cloudflare auth and D1 access
        run: |
          set -euo pipefail

          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"

          python3 - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["CLOUDFLARE_API_TOKEN"]
          account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"]

          def fetch(url: str):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req) as resp:
                  return json.load(resp)

          verify = fetch("https://api.cloudflare.com/client/v4/user/tokens/verify")
          if not verify.get("success") or verify.get("result", {}).get("status") != "active":
              raise SystemExit(f"Cloudflare token verify failed: {verify}")

          account = fetch(f"https://api.cloudflare.com/client/v4/accounts/{account_id}")
          if not account.get("success"):
              raise SystemExit(f"Cloudflare account lookup failed: {account}")
          PY

          npx wrangler d1 info venturedex-db --json --config wrangler.toml >/dev/null

      - name: Run unified release flow
        run: bash scripts/manage.sh release

      # Discovery runs only after release (including its live smoke checks).
      # Its independent cache is not a production release lock or deploy marker.
      - name: Restore previous discovery checkpoint
        id: discovery-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/venturedex-discovery-state
          key: venturedex-discovery-v1-${{ env.VENTUREDEX_RELEASE_SHA }}
          restore-keys: venturedex-discovery-v1-

      - name: Notify IndexNow for verified changed HTML URLs
        id: discovery
        continue-on-error: true
        run: |
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          npx tsx scripts/promotion/deploy-discovery.ts \
            --state-file "$RUNNER_TEMP/venturedex-discovery-state/state.json" \
            --output-dir "$RUNNER_TEMP/venturedex-deploy-discovery"

      - name: Save successful discovery checkpoint
        if: steps.discovery.outcome == 'success' && steps.discovery-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/venturedex-discovery-state
          key: venturedex-discovery-v1-${{ env.VENTUREDEX_RELEASE_SHA }}

      - name: Preserve post-deploy discovery evidence
        if: always() && steps.discovery.outputs.attempted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deploy-discovery-${{ env.VENTUREDEX_RELEASE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/venturedex-deploy-discovery/
          if-no-files-found: error
          retention-days: 90
