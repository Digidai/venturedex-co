name: Weekly Draft

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-draft-${{ github.repository }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Compute previous week
        id: week
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import date, timedelta

          today = date.today()
          week_end = today - timedelta(days=today.weekday() + 1)
          week_start = week_end - timedelta(days=6)

          print(f"week_start={week_start.isoformat()}")
          print(f"week_end={week_end.isoformat()}")
          PY

      - name: Draft weekly issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/weekly.py draft \
            --week-start "${{ steps.week.outputs.week_start }}" \
            --week-end "${{ steps.week.outputs.week_end }}" \
            --check-open-prs \
            --repo "${{ github.repository }}" \
            --write

      - name: Validate weekly draft
        run: python3 scripts/weekly.py validate

      - name: Install locked dependencies
        run: npm ci

      - name: Audit runtime and build dependencies
        run: npm audit --audit-level=high

      - name: Run complete local release gate
        run: bash scripts/manage.sh validate

      - name: Check whitespace
        run: git diff --check

      - name: Restore generated validation outputs
        run: |
          git restore --worktree -- d1/generated-seed.sql
          git clean -f -- public/og/weekly-*.png

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/weekly-draft-${{ steps.week.outputs.week_end }}
          delete-branch: true
          commit-message: "content: draft weekly issue for ${{ steps.week.outputs.week_end }}"
          title: Weekly draft for ${{ steps.week.outputs.week_start }} to ${{ steps.week.outputs.week_end }}
          draft: true
          body: |
            Automated weekly draft scaffold.

            Before this PR was created or updated, the bot branch passed `python3 scripts/weekly.py validate`, `npm audit --audit-level=high`, `bash scripts/manage.sh validate`, and `git diff --check`. GitHub may not start `pull_request` CI for the bot's initial push, so this pre-creation gate is the authoritative bot validation.

            Before merging:
            - replace every TODO with source-bound research
            - set status to published
            - set published_at
            - after any human edit, rerun `python3 scripts/weekly.py validate`, `bash scripts/manage.sh validate`, and `git diff --check`
            - restore `d1/generated-seed.sql` and generated Weekly OG files if validation changed them locally
